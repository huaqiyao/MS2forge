# FLASH 训练配置（DeniMS 风格三阶段范式）
# 输入：分子式（formula 硬约束）+ DreaMS 1024-d 嵌入
# 输出：分子图边类型（BFN 边去噪）
#
# 三阶段（由 model.stage 切换；不再有旧的 spectrum_mode 概念）：
#   - align     : MS↔Mol 对齐预训练（双塔 InfoNCE，不跑 BFN）
#                   ms_encoder(DreaMS) ⇄ graph_encoder(mol_graph) 投影到 256 维公共空间
#                   数据集：MSFileDataset（MSG，需配对 DreaMS+mol）
#                   产出 ckpt：含 ms_encoder + graph_encoder + inv_temperature
#   - graph2mol : Graph2Mol 预训练（用 graph_encoder(mol) 当 256 维条件，BFN 还原边）
#                   数据集：SmilesDataset（HMDB+DSSTox+COCONUT+MOSES，3.3M 大数据，仅需 mol）
#                   起点 ckpt：align ckpt（提取 graph_encoder 权重）
#                   通常 freeze_graph_encoder=true，只训 BFN 主干用条件
#                   产出 ckpt：含 graph_encoder + BFN 主干
#   - ms2mol    : MS2Mol 微调（用 ms_encoder(DreaMS) 当 256 维条件，BFN 还原边）
#                   数据集：MSFileDataset（MSG）
#                   起点 ckpt：graph2mol ckpt（BFN 主干）+ align ckpt（ms_encoder via --align_ckpt）
#                   产出 ckpt：含 ms_encoder + BFN 主干（可推理）
#
# 启动命令：
#   1) align:     python scripts/train.py --config configs/train.yml
#   2) graph2mol: python scripts/train.py --config configs/train.yml --pretrained_ckpt align.pt
#   3) ms2mol:    python scripts/train.py --config configs/train.yml \
#                       --pretrained_ckpt graph2mol.pt --align_ckpt align.pt

# ============================== 模型配置 ==============================
model:
  # ★ DeniMS ckpt 路径（仅 align 阶段；首次启动会自动 strict=False 加载到 ms_encoder + graph_encoder）
  # 设 null 跳过；正常路径填 DeniMS Encoder_Contrastive_FragHub.pth 的本地位置
  align_ckpt_path: ./checkpoints/Encoder_Contrastive_FragHub.pth

  # ★ 唯一阶段切换字段：align / graph2mol / ms2mol
  stage: ms2mol

  # 公共语义空间维度（三阶段共用）
  # ★ 必须 = 512 才能加载 DeniMS Encoder_Contrastive_FragHub.pth ckpt
  contrastive_dim: 512

  # 节点 atom 嵌入维度（仅 graph2mol/ms2mol 用）
  node_dim: 256

  # 对称性破缺噪声强度
  noise_scale: 0.0

  # 仪器 + ionization 条件嵌入（graph2mol/ms2mol 用）
  condition_embedding:
    embed_dim: 256

  # MSEncoder（DeniMS TransformerModel 复刻；align / ms2mol 实例化）
  # 默认参数与 DeniMS Encoder_Contrastive_FragHub.pth 完全对齐
  ms_encoder:
    dim_sos: 13                     # precursor(2) + collision_energy(11)
    dim_formula: 144                # 9 元素 × 16-d sinusoidal
    hidden_dim: 512
    num_transformer_layers: 3
    nhead: 8
    dropout: 0.1
    input_dropout: 0.1
    max_len: 129

  # GraphEncoder（DeniMS GraphTransformer_embedding 复刻；align / graph2mol 实例化）
  # 内部维度按 ckpt 硬编码：input X=11, E=5；hidden dx=256, de=128, n_head=8
  graph_encoder:
    n_layers: 4

  # BFN 主干 GNN（仅 graph2mol/ms2mol 实例化；FLASH 自己的 BFN 边去噪，不用 DiGress）
  gat:
    hidden_dim: 256
    num_layers: 4
    dropout: 0.15

  # BFN 采样步数
  flow:
    n_timesteps: 100         # 推理步数
    eval_n_timesteps: 20     # 训练时评估步数

  # 离散 BFN 精度参数
  flash:
    beta1: 3.0

  # ---- align 阶段独有 ----
  contrastive_temperature_init: 30.0   # inv_temperature 初始 = 1/30，temperature ≤ 200 (clamp)

  # ---- graph2mol 阶段独有 ----
  freeze_graph_encoder: true   # 通常冻结 align 训好的 graph_encoder，只训 BFN 主干

  # ---- ms2mol 阶段独有 ----
  freeze_ms_encoder: false     # 是否冻结 ms_encoder（false = 与 BFN 一起微调）

# ============================== 训练配置 ==============================
train:
  seed: 2026
  batch_size: 64
  num_workers: 0
  pin_memory: false
  max_iters: 10000001
  val_freq: 2000
  save_freq: 2000
  max_grad_norm: 50.0
  warmup_iters: 500

  val_subset_ratio: 0.1
  eval_batch_size: 128
  eval_num_samples: 1
  eval_split: val

  log_edge_distribution: false

  # ============================================================
  # ★ Align 阶段反过拟合开关（默认全关；按需开启）★
  # 实现参考：
  #   SupContrast (HobbitLong/SupContrast)        - multi_positive
  #   MolCLR (yuyangw/MolCLR)                     - augment.permute_nodes
  #   MixCo  (Lee-Gihun/MixCo-Mixup-Contrast)     - mixup_alpha
  # ============================================================

  # 方案 1: 多正样本 InfoNCE（同 SMILES 多张谱图视为正样本，参考 SupConLoss）
  multi_positive: false

  # 方案 8: MixCo 风格 mixup 对比损失（在嵌入空间做 mixup + soft label CE）
  # alpha=0 关闭；推荐 0.5~1.0 启用
  mixup_alpha: 0.0
  mixup_weight: 0.5            # mixup 损失权重，最终 loss = main + mixup_weight * mixup

  # 方案 2: 双视角数据增强
  augment:
    dreams_noise_sigma: 0.0    # raw DreaMS 嵌入加高斯噪声 σ；0=关闭，推荐 0.05~0.1
    permute_nodes: false       # 每分子独立随机节点重排（参考 MolCLR 节点置换思路）

  optimizer:
    type: adamw
    lr: 5.e-4
    weight_decay: 1.e-4
    beta1: 0.99
    beta2: 0.999

  scheduler:
    type: plateau
    factor: 0.8
    patience: 1000
    min_lr: 1.e-6

# ============================== 数据转换 ==============================
transform:
  use_mask_node: true
  use_mask_edge: false

# ============================== 数据集 ==============================
# train.py 按 model.stage 自动切换：
#   align     → MSFileDataset (msfile, MSG 配对)
#   graph2mol → SmilesDataset (smiles, HMDB+DSSTox+COCONUT+MOSES 3.3M 仅 mol)
#   ms2mol    → MSFileDataset (msfile, MSG 配对)
dataset:
  root: ./data/msg_diffms       # DiffMS 预处理过的 MSG（含 sub-formula 标注；DeniMS 格式必需）
  instrument_type: all          # MSFileDataset 用
  data_split_mode: split        # MSFileDataset 用

# ============================== 化学配置 ==============================
chem:
  # 固定原子表，三阶段必须一致
  atomic_numbers: [5, 6, 7, 8, 9, 14, 15, 16, 17, 33, 34, 35, 53]
  mol_bond_types: [1, 2, 3, 4]
